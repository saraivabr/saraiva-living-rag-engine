          ease: "none",
          onUpdate: () => {
            let state = controlStates[0];

                state = controlStates[index];

              controlText.textContent = state.text;
              controlKicker.textContent = state.kicker;
              reviewIcon.style.opacity = state.icon === "review" ? "1" : "0";
              conversationIcon.style.opacity = state.icon === "conversation" ? "1" : "0";
              controlProgress.style.width = state.icon === "review" ? "50%" : "100%";

        },
        3.5

        5.98
