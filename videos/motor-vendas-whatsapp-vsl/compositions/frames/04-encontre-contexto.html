  <script>
    (() => {
      const frameRoot = document.querySelector('[data-composition-id="04-encontre-contexto"]');
      const query = (selector) => frameRoot.querySelector(selector);
      const queryAll = (selector) => Array.from(frameRoot.querySelectorAll(selector));
      const timeline = gsap.timeline({ paused: true });

      const image = query(".f04-encontre-contexto-map-image");
      const region = query("#f04-encontre-contexto-region");
      const segment = query("#f04-encontre-contexto-segment");
      const status = query("#f04-encontre-contexto-status");
      const statusCopy = query("#f04-encontre-contexto-status-copy");
      const statusCheck = query("#f04-encontre-contexto-status-check");
      const markers = [
        query("#f04-encontre-contexto-marker-a"),
        query("#f04-encontre-contexto-marker-b"),
        query("#f04-encontre-contexto-marker-c"),
      ];
      const cards = [
        query("#f04-encontre-contexto-card-a"),
        query("#f04-encontre-contexto-card-b"),
        query("#f04-encontre-contexto-card-c"),
      ];
      const lines = [
        query("#f04-encontre-contexto-line-a"),
        query("#f04-encontre-contexto-line-b"),
        query("#f04-encontre-contexto-line-c"),
      ];

      timeline.fromTo(
        image,
        { opacity: 0.32, scale: 1.025 },
        { opacity: 0.68, scale: 1, duration: 0.5, ease: "power2.out" },
        0,
      );
      timeline.fromTo(
        region,
        { x: -54, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        0.18,
      );
      timeline.fromTo(
        segment,
        { x: -54, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        1.02,
      );

      timeline.fromTo(
        status,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        5.56,
      );
      timeline.fromTo(
        statusCheck,
        { scale: 0.3, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(1.6)" },
        6.84,
      );

      markers.forEach((marker, index) => {
        timeline.fromTo(
          marker,
          { scale: 0.25, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.46, ease: "back.out(1.55)" },
          2.05 + index * 0.32,
        );
      });

      cards.forEach((card, index) => {
        timeline.fromTo(
          card,
          { x: -26, y: 18, scale: 0.88, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.72, ease: "power3.out" },
          2.28 + index * 0.5,
        );
      });

      lines.forEach((line, index) => {
        const length = Math.hypot(
          Number(line.getAttribute("x2")) - Number(line.getAttribute("x1")),
          Number(line.getAttribute("y2")) - Number(line.getAttribute("y1")),
        );
        timeline.fromTo(
          line,
          { strokeDasharray: length, strokeDashoffset: length, opacity: 0 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.58, ease: "power2.out" },
          2.74 + index * 0.5,
        );
      });

      const metricTiming = {
        public: 3.12,
        signal: 3.84,
        context: 4.56,
      };
      Object.entries(metricTiming).forEach(([kind, at]) => {
        queryAll(`[data-metric-kind="${kind}"]`).forEach((metric, index) => {
          timeline.fromTo(
            metric,
            { x: -12, opacity: 0.18 },
            { x: 0, opacity: 1, duration: 0.38, ease: "power2.out" },
            at + index * 0.11,
          );
        });
      });

      const queueTargets = [
        { x: 10, y: 420, lineX: 975, lineY: 600 },
        { x: -55, y: 390, lineX: 1275, lineY: 600 },
        { x: -70, y: 200, lineX: 1575, lineY: 600 },
      ];
      cards.forEach((card, index) => {
        timeline.to(
          card,
          {
            x: queueTargets[index].x,
            y: queueTargets[index].y,
            duration: 1.08,
            ease: "power3.out",
          },
          5.5 + index * 0.08,
        );
        timeline.to(
          lines[index],
          {
            attr: {
              x2: queueTargets[index].lineX,
              y2: queueTargets[index].lineY,
            },
            duration: 1.08,
            ease: "power3.out",
          },
          5.5 + index * 0.08,
        );
      });

      const statusStates = [
        { t: 0, text: "ORGANIZANDO" },
        { t: 1.34, text: "PRONTO PARA ANALISAR" },
      ];
      const statusDriver = { t: 0 };
      timeline.to(
        statusDriver,
        {
          t: 3.119,
          duration: 3.119,
          ease: "none",
          onUpdate: () => {
            let current = statusStates[0].text;
            for (let index = statusStates.length - 1; index >= 0; index -= 1) {
              if (statusDriver.t >= statusStates[index].t) {
                current = statusStates[index].text;
                break;
              }
            }
            statusCopy.textContent = current;
          },
        },
        5.5,
      );
      timeline.set(
        status,
        { backgroundColor: "#116336", color: "#ffffff" },
        6.84,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-encontre-contexto"] = timeline;
    })();
