  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameId = "01-prompt-ou-motor";
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;

      const sceneOne = document.getElementById("01-prompt-ou-motor-scene-one");
      const sceneTwo = document.getElementById("01-prompt-ou-motor-scene-two");
      const sceneThree = document.getElementById("01-prompt-ou-motor-scene-three");
      const lightGround = document.getElementById("01-prompt-ou-motor-ground-light");
      const topbar = document.getElementById("01-prompt-ou-motor-topbar");
      const bottomRule = document.getElementById("01-prompt-ou-motor-bottom-rule");
      const questionLabel = document.getElementById("01-prompt-ou-motor-question-label");
      const typedText = document.getElementById("01-prompt-ou-motor-typed-text");
      const caret = document.getElementById("01-prompt-ou-motor-caret");
      const finalToken = document.getElementById("01-prompt-ou-motor-final-token");

      tl.set(sceneOne, { autoAlpha: 1 }, 0);
      tl.set(sceneTwo, { autoAlpha: 0 }, 0);
      tl.set(sceneThree, { autoAlpha: 0 }, 0);
      tl.set(lightGround, { autoAlpha: 0 }, 0);

      const introContent = [
        { title: "VOCÊ", hold: 0.12 },
        { title: "JÁ", hold: 0.10 },
        { title: "TEM", hold: 0.11 },
        { title: "O", hold: 0.09 },
        { title: "PROMPT", hold: 0.24 }
      ];
      let introCursor = 0.08;
      const introTimeline = introContent.map((entry) => {
        const duration = 0.16 + entry.title.length * 0.025 + entry.hold;
        const start = introCursor;
        introCursor += duration;
        return { ...entry, start, end: introCursor };
      });

      introTimeline.forEach((entry, index) => {
        const word = document.getElementById(`01-prompt-ou-motor-word-${index}`);
        tl.fromTo(
          word,
          { autoAlpha: 0, y: 34, filter: "blur(12px)" },
          { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.34, ease: "power3.out" },
          entry.start
        );
      });

      tl.set(sceneOne, { autoAlpha: 0 }, 2.1);
      tl.set(sceneTwo, { autoAlpha: 1 }, 2.1);
      tl.fromTo(
        questionLabel,
        { autoAlpha: 0, y: 18 },
        { autoAlpha: 1, y: 0, duration: 0.36, ease: "power2.out" },
        2.1
      );

      const typedSequence = [
        { t: 0.00, text: "" },
        { t: 0.16, text: "só" },
        { t: 0.38, text: "só c" },
        { t: 0.54, text: "só criar" },
        { t: 0.86, text: "só criar um" },
        { t: 1.18, text: "só criar um s" },
        { t: 1.36, text: "só criar um site" },
        { t: 1.64, text: "só criar um site?" }
      ];
      const textAt = (time) => {
        for (let i = typedSequence.length - 1; i >= 0; i -= 1) {
          if (time >= typedSequence[i].t) return typedSequence[i].text;
        }
        return "";
      };
      const typeDriver = { t: 0 };
      let lastTypedState = "";
      tl.to(
        typeDriver,
        {
          t: 2.2,
          duration: 2.2,
          ease: "none",
          onUpdate: () => {
            const nextText = textAt(typeDriver.t);
            if (nextText !== lastTypedState) {
              typedText.textContent = nextText;
              lastTypedState = nextText;
            }
          }
        },
        2.25
      );

      const blinkDriver = { p: 0 };
      tl.to(
        blinkDriver,
        {
          p: Math.PI * 6,
          duration: 2.4,
          ease: "none",
          onUpdate: () => {
            caret.style.opacity = Math.sin(blinkDriver.p) >= 0 ? "1" : "0";
          }
        },
        2.1
      );

      tl.set(sceneTwo, { autoAlpha: 0 }, 4.5);
      tl.set(sceneThree, { autoAlpha: 1 }, 4.5);
      tl.set(lightGround, { autoAlpha: 1 }, 4.5);
      tl.set(caret, { autoAlpha: 0 }, 4.5);
      tl.set(topbar, { color: "#116336", borderBottomColor: "#116336" }, 4.5);
      tl.set(bottomRule, { backgroundColor: "#116336" }, 4.5);
      tl.fromTo(
        finalToken,
        { scale: 1.055 },
        { scale: 1, duration: 0.42, ease: "power3.out" },
        4.5
      );
    })();
  </script>
